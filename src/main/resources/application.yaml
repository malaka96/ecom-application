spring:
  application:
    name: ecom-application

  datasource:
    url: jdbc:mysql://localhost:3306/ecom_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create # when use "create" jpa delete existing tables then create new tables
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "*"


